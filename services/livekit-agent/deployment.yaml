apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-agent
  template:
    metadata:
      labels:
        app: livekit-agent
    spec:
      containers:
        - name: livekit-agent
          image: fbellame/livekit-agent:latest
          # No ports needed - pod registers directly to LiveKit cloud
          envFrom:
            - secretRef:
                name: livekit-agent-secrets

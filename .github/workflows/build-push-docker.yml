name: Build & Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'docker.io/fbellame/livekit-agent' }}
  DOCKERFILE: services/livekit-agent/Dockerfile
  CONTEXT: .
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'fbellame' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep buildx (lightweight); no QEMU needed
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (amd64 default)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          # platforms omitted -> defaults to runner arch (linux/amd64)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # New job for deployment artifacts
  create-deployment-artifacts:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deployment-artifacts
          cp services/livekit-agent/docker-compose.yml deployment-artifacts/
          cp services/livekit-agent/systemd/livekit-agent-compose@.service deployment-artifacts/
          cp services/livekit-agent/deploy-vm.sh deployment-artifacts/
          chmod +x deployment-artifacts/deploy-vm.sh
          
          # Create a deployment README
          cat > deployment-artifacts/README.md << 'EOF'
          # LiveKit Agent + DataDog Deployment
          
          This package contains everything needed to deploy LiveKit Agent with DataDog monitoring on a DigitalOcean VM.
          
          ## Files:
          - `deploy-vm.sh` - Main deployment script
          - `docker-compose.yml` - Docker Compose configuration
          - `livekit-agent-compose@.service` - Systemd service file
          
          ## Quick Start:
          1. Upload these files to your VM
          2. Run: `sudo bash deploy-vm.sh`
          3. Configure environment files
          4. Start the service
          
          See the script output for detailed instructions.
          EOF

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-artifacts/
          retention-days: 30

name: Build & Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]   # semver tags like v1.2.3
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'docker.io/fbellame/future-survey' }}
  DOCKERFILE: ./Dockerfile     # change if not at repo root
  CONTEXT: .                   # change if building from subdir

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch   # e.g., main
            type=sha                # e.g., sha-abcdef
            type=semver,pattern={{version}}  # v1.2.3 -> 1.2.3
            type=semver,pattern={{major}}.{{minor}}  # 1.2
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (multi-arch example)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64,linux/arm64     # drop arm64 if not needed
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

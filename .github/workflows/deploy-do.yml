name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete existing droplet first?"
        required: false
        default: "false"

env:
  VM_NAME: ${{ vars.VM_NAME }}
  VPC_UUID: ${{ vars.VPC_UUID }}
  REGION: ${{ vars.REGION || 'tor1' }}
  IMAGE: ${{ vars.IMAGE || 'ubuntu-24-04-x64' }}
  SIZE: ${{ vars.SIZE || 's-2vcpu-4gb' }}
  TAGS: ${{ vars.TAGS || 'prod' }}
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
  APP_PORT: ${{ vars.APP_PORT || '8081' }}
  HEALTH_CHECK_PORT: ${{ vars.HEALTH_CHECK_PORT || '8080' }}

  # Non-secret constants
  LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Write SSH key files
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}"  > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Ensure/Fetch SSH key ID from DigitalOcean
        id: sshkey
        run: |
          set -euo pipefail
          KEY_NAME="gh-${GITHUB_REPOSITORY}-${GITHUB_RUN_ID}"
          PUB_FP=$(ssh-keygen -E md5 -lf ~/.ssh/id_ed25519.pub | awk '{print $2}' | sed 's/^MD5://')
          echo "Local public key MD5 fingerprint: $PUB_FP"

          EXIST_ID=$(doctl compute ssh-key get "$PUB_FP" --format ID --no-header 2>/dev/null || true)
          if [ -n "${EXIST_ID:-}" ]; then
            echo "Found existing DO SSH key (ID: $EXIST_ID)"
            echo "key_id=$EXIST_ID" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No key with fingerprint $PUB_FP in DO; creating..."
          set +e
          CREATE_OUT=$(doctl compute ssh-key create "$KEY_NAME" \
            --public-key "$(cat ~/.ssh/id_ed25519.pub)" \
            --format ID --no-header 2>&1)
          STATUS=$?
          set -e
          if [ $STATUS -eq 0 ]; then
            echo "Created new DO SSH key (ID: $CREATE_OUT)"
            echo "key_id=$CREATE_OUT" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Create failed (likely exists). Re-fetching by fingerprint..."
          EXIST_ID=$(doctl compute ssh-key get "$PUB_FP" --format ID --no-header 2>/dev/null || true)
          if [ -n "${EXIST_ID:-}" ]; then
            echo "Recovered existing DO SSH key (ID: $EXIST_ID)"
            echo "key_id=$EXIST_ID" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "ERROR: Could not create or fetch the SSH key. Full output:"
          echo "$CREATE_OUT" >&2
          exit 1

      - name: Optionally delete existing droplet
        if: ${{ github.event.inputs.recreate == 'true' }}
        run: |
          set -e
          if doctl compute droplet get "$VM_NAME" >/dev/null 2>&1; then
            doctl compute droplet delete -f "$VM_NAME"
            sleep 10
          fi

      - name: Create droplet if missing (with cloud-init)
        run: |
          set -e
          if ! doctl compute droplet get "$VM_NAME" >/dev/null 2>&1; then
            doctl compute droplet create "$VM_NAME" \
              --region "$REGION" \
              --image "$IMAGE" \
              --size "$SIZE" \
              --ssh-keys "${{ steps.sshkey.outputs.key_id }}" \
              --vpc-uuid "$VPC_UUID" \
              --tag-names "$TAGS" \
              --user-data-file services/livekit-agent/cloud-init/base.yaml \
              --wait
          fi

      - name: Get droplet IP
        id: ip
        run: |
          IP=$(doctl compute droplet get "$VM_NAME" --format PublicIPv4 --no-header)
          if [ -z "$IP" ]; then
            echo "Droplet IP not found" >&2
            exit 1
          fi
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "Droplet IP: $IP"

      - name: Wait for SSH to respond
        run: |
          set -e
          IP=${{ steps.ip.outputs.ip }}
          for i in {1..40}; do
            if nc -zv $IP 22 >/dev/null 2>&1; then
              echo "SSH up."
              exit 0
            fi
            echo "Waiting for SSH ($i/40)..."
            sleep 5
          done
          echo "SSH did not become ready in time" >&2
          exit 1

      - name: Add host key to known_hosts
        run: |
          IP=${{ steps.ip.outputs.ip }}
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -R "$IP" 2>/dev/null || true
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts

      # 🔧 THE FIX: wait for cloud-init to finish and Docker to be active
      - name: Wait for cloud-init + Docker
        run: |
          IP=${{ steps.ip.outputs.ip }}
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@$IP '
            set -euo pipefail
            command -v cloud-init >/dev/null && cloud-init status --wait || true
            for i in {1..60}; do
              if systemctl is-active --quiet docker; then
                echo "docker is active"
                break
              fi
              echo "waiting for docker ($i/60)..."
              sleep 2
            done
            systemctl status docker --no-pager || true
          '

      - name: Build env file from Secrets/Variables
        run: |
          {
            echo "DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}"
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "LIVEKIT_URL=${{ env.LIVEKIT_URL }}"
            echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}"
            echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}"
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            echo "AWS_REGION=${{ env.AWS_REGION }}"
            echo "SUPABASE_URL=${{ env.SUPABASE_URL }}"
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}"
          } > livekit-agent.env

      - name: Copy env and systemd unit
        run: |
          IP=${{ steps.ip.outputs.ip }}
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes livekit-agent.env root@$IP:/tmp/livekit-agent.env
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes services/livekit-agent/systemd/livekit-agent@.service root@$IP:/tmp/livekit-agent@.service

      - name: Remote configure systemd + docker login + start agent
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          APP_PORT: ${{ env.APP_PORT }}
          HEALTH_CHECK_PORT: ${{ env.HEALTH_CHECK_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          IP=${{ steps.ip.outputs.ip }}
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@$IP \
            "export DOCKER_IMAGE='${DOCKER_IMAGE}'; \
            export APP_PORT='${APP_PORT}'; \
            export HEALTH_CHECK_PORT='${HEALTH_CHECK_PORT}'; \
            export DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}'; \
            export DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}'; \
            export DD_API_KEY='${DD_API_KEY}'; \
            bash -s" <<'REMOTE'
          set -euo pipefail

          mv /tmp/livekit-agent.env /etc/livekit-agent.env
          chmod 600 /etc/livekit-agent.env

          mv /tmp/livekit-agent@.service /etc/systemd/system/livekit-agent@.service
          chmod 644 /etc/systemd/system/livekit-agent@.service

          install -d -m 0755 /etc/systemd/system/livekit-agent@.service.d
          cat >/etc/systemd/system/livekit-agent@.service.d/10-env.conf <<EOF
          [Service]
          Environment=DOCKER_IMAGE=${DOCKER_IMAGE}
          Environment=APP_PORT=${APP_PORT}
          Environment=HEALTH_CHECK_PORT=${HEALTH_CHECK_PORT}
          EOF

          systemctl daemon-reload

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          # Install Datadog Agent
          echo "Installing Datadog Agent..."
          DD_APM_INSTRUMENTATION_LIBRARIES=java:1,python:3,js:5,php:1,dotnet:3,ruby:2 \
          DD_APM_INSTRUMENTATION_ENABLED=docker \
          DD_NO_AGENT_INSTALL=true \
          bash -c "$(curl -L https://install.datadoghq.com/scripts/install_script_agent7.sh)"

          # Create Datadog agent systemd service
          cat >/etc/systemd/system/datadog-agent.service <<EOF
          [Unit]
          Description=Datadog Agent
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f dd-agent
          ExecStart=/usr/bin/docker run -d --name dd-agent \\
            -p 8125:8125/udp \\
            -e DD_API_KEY=${DD_API_KEY} \\
            -e DD_SITE="us5.datadoghq.com" \\
            -e DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true \\
            -e DD_ENV=dev \\
            -e DD_APM_ENABLED=true \\
            -e DD_APM_NON_LOCAL_TRAFFIC=true \\
            -e DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket \\
            -e DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket \\
            -v /var/run/datadog:/var/run/datadog \\
            -v /var/run/docker.sock:/var/run/docker.sock:ro \\
            -v /proc/:/host/proc/:ro \\
            -v /sys/fs/cgroup/:/host/sys/fs/cgroup:ro \\
            -v /var/lib/docker/containers:/var/lib/docker/containers:ro \\
            gcr.io/datadoghq/agent:7
          ExecStop=/usr/bin/docker stop dd-agent
          ExecStopPost=-/usr/bin/docker rm -f dd-agent
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          # Create datadog directory for socket mounting
          mkdir -p /var/run/datadog

          # Enable and start Datadog agent
          systemctl daemon-reload
          systemctl enable --now datadog-agent
          systemctl status --no-pager datadog-agent || true

          systemctl enable --now livekit-agent@1
          systemctl status --no-pager livekit-agent@1 || true
          REMOTE

      - name: Tail first logs
        run: |
          IP=${{ steps.ip.outputs.ip }}
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes root@$IP \
            'journalctl -u livekit-agent@1 -n 200 --no-pager || docker logs --tail=200 livekit-agent-1 || true'
